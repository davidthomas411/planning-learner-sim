[project]
name = "dosim-trajectory-sim"
version = "0.1.0"
description = "Synthetic proof-of-principle for endpoint versus trajectory supervision in treatment planning"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gpu = ["torch==2.11.0"]
clinical = ["pydicom>=3.0", "scipy>=1.14"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
